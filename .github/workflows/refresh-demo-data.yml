# =============================================================================
# Keep the deployed demo's data current.
#
# The dashboard treats a curated window older than two hours as stale and says
# so — correctly, because a stalled pipeline must not look like a calm city. On
# a free-tier deployment there is no Kafka and no Spark to keep writing, so
# without this the demo is honestly-labelled stale within two hours of seeding.
#
# This runs the generator and the local pipeline runner against the hosted
# database, which is the same validation, windowing and load path the streaming
# job uses — see docs/DATA_PIPELINE.md §1.
#
# Cadence is set by the backend, not by taste. `telemetry.max-age` is PT2H:
# beyond that a window is not "current" at all and the API reports zero zones
# reporting. Running every six hours therefore left the dashboard blind for four
# hours in every six — and blind did not look blank, it looked calm, because the
# incident and event counts came back as 0. That is the single most dangerous
# way this product can be wrong, and it was live.
#
# Hourly keeps the newest window an hour old at worst, an hour inside max-age.
#
# Budget: a private repository gets 2,000 free Actions minutes a month. Measured
# rather than assumed — recent runs take 15 to 60 seconds, not the three minutes
# this comment used to claim. Hourly is 720 runs at ~1 minute, leaving roughly
# 1,200 minutes for CI. A ten-minute keep-warm ping would still cost more than
# the whole allowance, which is why there is no keep-warm job; the cold start is
# documented in docs/DEPLOYMENT.md instead.
# =============================================================================

name: Refresh demo data

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours of telemetry to generate"
        required: false
        default: "3"

concurrency:
  group: refresh-demo-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Generate and load recent telemetry
    runs-on: ubuntu-latest
    # Skips cleanly on a fork or before the secret is configured, rather than
    # failing every six hours for a deployment that does not exist.
    if: ${{ github.repository_owner != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engineering/requirements.txt

      - name: Check the deployment is configured
        id: check
        env:
          DSN: ${{ secrets.HOSTED_PG_DSN }}
        run: |
          if [ -z "$DSN" ]; then
            echo "HOSTED_PG_DSN is not set — no hosted database to refresh."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        working-directory: data-engineering
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and load
        if: steps.check.outputs.configured == 'true'
        working-directory: data-engineering
        env:
          CITYPULSE_PG_DSN: ${{ secrets.HOSTED_PG_DSN }}
        run: |
          HOURS="${{ inputs.hours || '3' }}"
          FROM=$(date -u -d "$HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)
          TO=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # A fresh seed each run, derived from the date, so successive refreshes
          # do not replay an identical day. Deterministic within a run, so a
          # failure can be reproduced.
          SEED=$(date -u +%Y%m%d%H)

          # One tick per zone per minute, not per five. The curated window is
          # five minutes, so a 300-second tick put exactly one reading in each
          # — and every alert rule begins with a thin-sample guard requiring
          # three. Every rule therefore returned empty before it looked at the
          # value, and the deployment raised zero alerts in every city while
          # Delhi sat at 1.03 of capacity, past the 1.00 threshold. The
          # dashboard said "Nothing suggested yet" on every row, which read as
          # "nothing to do" rather than "the engine cannot see this".
          #
          # Sixty seconds gives five readings per window: past the guard with
          # margin, and closer to what a real feed delivers. Measured before
          # changing it — generation stays about a second and the load a
          # couple, so the extra events cost the run almost nothing.
          python -m generator.main --sink jsonl --out /tmp/refresh.jsonl \
            --no-realtime --seed "$SEED" --tick-seconds 60 \
            --simulate-from "$FROM" --simulate-to "$TO" --quiet

          python -m pipeline.local_runner --input /tmp/refresh.jsonl \
            --max-lateness-hours $((HOURS + 2)) --quiet

      # ---------------------------------------------------------------------
      # Real air quality, best source first.
      #
      # Both steps run after the generated load and before detection, in that
      # order for a reason: the load has just rebuilt these windows from
      # generated air, and each ingester re-points the ones it covers and
      # recomputes risk. Detection reads those windows, so running it first
      # would measure the invented air and then have the real number arrive
      # underneath it.
      #
      # Stations first, then the model. The overlay ranks MEASURED above
      # MODELLED whatever order they arrive in, so this is for the log rather
      # than the result: the second step reports how many windows the first one
      # had already claimed.
      #
      # data.gov.in is deliberately absent. `ingest.cpcb` still works and is
      # still tested, but that endpoint has answered every request from this
      # deployment with "Key not authorised", and a step that fails on every
      # hourly run teaches a reader to ignore a red mark. WAQI republishes the
      # same CPCB stations. To put it back, add a step running `ingest.cpcb`
      # with CPCB_API_KEY once data.gov.in issues a key that works.
      # ---------------------------------------------------------------------

      - name: Ingest measured air quality from monitoring stations
        # Not gated on the token: the module reports what it did and writes
        # nothing without one, so a fork with no WAQI_API_TOKEN gets a clear
        # line in the log rather than a step that looks like it ran.
        if: steps.check.outputs.configured == 'true'
        continue-on-error: true
        working-directory: data-engineering
        env:
          CITYPULSE_PG_DSN: ${{ secrets.HOSTED_PG_DSN }}
          WAQI_API_TOKEN: ${{ secrets.WAQI_API_TOKEN }}
        run: python -m ingest.waqi

      - name: Ingest modelled air quality for every other zone
        # No key at all, so this one runs everywhere including forks. It is what
        # keeps the other fifty-odd zones off invented air: stations sit at
        # fixed points and cover a small minority of the map.
        if: steps.check.outputs.configured == 'true'
        continue-on-error: true
        working-directory: data-engineering
        env:
          CITYPULSE_PG_DSN: ${{ secrets.HOSTED_PG_DSN }}
        run: python -m ingest.open_meteo

      - name: Ingest modelled weather for every city
        # After both air steps and still before detection. Order between the
        # two overlays does not matter — each reads the other's column out of
        # zone_metrics when it recomputes risk, so they converge either way —
        # but both must land before the detector reads the windows.
        if: steps.check.outputs.configured == 'true'
        continue-on-error: true
        working-directory: data-engineering
        env:
          CITYPULSE_PG_DSN: ${{ secrets.HOSTED_PG_DSN }}
        run: python -m ingest.weather

      - name: Issue forecasts and detect anomalies
        if: steps.check.outputs.configured == 'true'
        working-directory: data-engineering
        env:
          CITYPULSE_PG_DSN: ${{ secrets.HOSTED_PG_DSN }}
        # Baselines are not relearned every cycle: they describe weeks of
        # history and would barely move, while relearning is the slowest step
        # here. The training job is run separately when the model should change.
        run: |
          python -m ml.predict 2>&1 | tail -1
          python -m ml.score 2>&1 | head -2
          python -m intelligence.jobs detect
          python -m intelligence.jobs memory

      - name: Rebuild stored anomaly sentences in the current wording
        # The sentence shown on the Command Center is composed when a window is
        # judged and stored on the row, so changing the wording leaves every
        # existing row phrased the old way — for the six hours the feed covers,
        # which is exactly the rows someone is reading now. This rebuilds them
        # from the evidence already on the row, by the same function the
        # detector calls. A no-op once they are current.
        if: steps.check.outputs.configured == 'true'
        continue-on-error: true
        working-directory: data-engineering
        env:
          CITYPULSE_PG_DSN: ${{ secrets.HOSTED_PG_DSN }}
        run: python -m intelligence.rephrase

      - name: Report what landed
        if: steps.check.outputs.configured == 'true'
        working-directory: data-engineering
        env:
          CITYPULSE_PG_DSN: ${{ secrets.HOSTED_PG_DSN }}
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["CITYPULSE_PG_DSN"]) as c, c.cursor() as cur:
              cur.execute("""
                  SELECT max(window_start),
                         count(*) FILTER (WHERE window_start > now() - interval '8 hours'),
                         pg_size_pretty(pg_database_size(current_database()))
                  FROM zone_metrics
              """)
              newest, recent, size = cur.fetchone()
              print(f"newest window: {newest}")
              print(f"windows in the last 8h: {recent}")
              print(f"database size: {size}")

              # The number this workflow exists to move. A run that loaded
              # windows but left them all SYNTHETIC did not fail — both feeds
              # are continue-on-error — and this is the only place that shows it.
              cur.execute("""
                  SELECT coalesce(aqi_source, 'no AQI'), count(*)
                    FROM zone_metrics
                   WHERE window_start > now() - interval '2 hours'
                   GROUP BY 1 ORDER BY 2 DESC
              """)
              print("air provenance, last 2h:")
              for label, count in cur.fetchall():
                  print(f"  {label:<10} {count}")

              cur.execute("""
                  SELECT coalesce(weather_source, 'no reading'), count(*)
                    FROM zone_metrics
                   WHERE window_start > now() - interval '2 hours'
                   GROUP BY 1 ORDER BY 2 DESC
              """)
              print("weather provenance, last 2h:")
              for label, count in cur.fetchall():
                  print(f"  {label:<10} {count}")
          PY
