# Throwaway diagnostic. Separates three explanations for the 502s the CPCB
# ingest is getting: the request size, the key, or the resource itself.
#
# Prints status codes and a short body excerpt. Never prints the key, and never
# the request URL — the key travels in the query string, so echoing the URL
# would put it in a log.
#
# Delete once the answer is known.

name: CPCB probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask three questions
        env:
          KEY: ${{ secrets.CPCB_API_KEY }}
          RESOURCE: 3b01bcb8-0b14-4abf-b6f2-c1bfd384ba69
        run: |
          if [ -z "$KEY" ]; then echo "CPCB_API_KEY is not set"; exit 1; fi
          echo "key length: ${#KEY}"

          probe() {
            local label="$1" url="$2"
            code=$(curl -sS -m 120 -o /tmp/body.json -w '%{http_code}' "$url" || echo "curl-failed")
            printf '%-38s -> %s  (%s bytes)\n' "$label" "$code" "$(wc -c </tmp/body.json)"
            head -c 200 /tmp/body.json; echo; echo "---"
          }

          # 1. Does the service answer this key at all, at the smallest size?
          probe "key + limit=1" \
            "https://api.data.gov.in/resource/$RESOURCE?api-key=$KEY&format=json&limit=1"

          # 2. Is it the size?
          probe "key + limit=500" \
            "https://api.data.gov.in/resource/$RESOURCE?api-key=$KEY&format=json&limit=500"

          # 3. Is the runner itself refused, independent of the key?
          probe "no key (expect 400 if reachable)" \
            "https://api.data.gov.in/resource/$RESOURCE?format=json&limit=1"
