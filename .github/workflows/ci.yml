# =============================================================================
# CityPulse OS — CI
#
# Pipeline (PRD §34): lint → test → build → security checks → docker build.
#
# Deployment is deliberately absent: no cloud environment exists yet, and a
# deploy job that does nothing would report green while proving nothing. It is
# added in Phase 8, together with the AWS infrastructure it targets.
#
# Jobs run in parallel where they are independent, and the docker job gates on
# both language jobs so an image is never built from code that failed its tests.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        # Integration tests run against real PostgreSQL. The schema depends on
        # partial unique indexes, check constraints and TIMESTAMPTZ semantics
        # that an in-memory database does not reproduce, so a test passing
        # against H2 would say nothing about production behaviour.
        image: postgres:17-alpine
        env:
          POSTGRES_DB: citypulse_test
          POSTGRES_USER: citypulse
          # CI-only, throwaway, and never used outside this ephemeral container.
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citypulse -d citypulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Verify migrations match the JPA mappings
        # ddl-auto=validate makes the application refuse to start when an entity
        # and its table disagree, so a successful test run is also a schema check.
        run: ./backend/mvnw -B -f backend/pom.xml compile

      - name: Unit and integration tests
        env:
          CITYPULSE_TEST_DB_URL: jdbc:postgresql://localhost:5432/citypulse_test
          CITYPULSE_TEST_DB_USER: citypulse
          CITYPULSE_TEST_DB_PASSWORD: ci-postgres-password
        run: ./backend/mvnw -B -f backend/pom.xml verify

      - name: Publish test report
        # Runs even on failure — a red build is exactly when the report matters.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  frontend:
    name: Frontend — lint, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # ci, not install: fails when package-lock.json is out of sync rather
        # than silently resolving different versions than a developer has.
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Component and unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        run: npm run build

  data-platform:
    name: Data platform — tests & dbt
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: citypulse
          POSTGRES_USER: citypulse
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citypulse -d citypulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engineering/requirements*.txt

      - name: Install dependencies
        working-directory: data-engineering
        # requirements.txt plus pytest, deliberately not requirements-dev.txt:
        # that pulls PySpark, a 400 MB download whose only CI value would be
        # re-running logic the pure-Python suite already covers. The Spark job
        # imports the same modules from common/, so a break there fails here.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.3.4

      - name: Unit tests
        working-directory: data-engineering
        # 187 tests over validation, transforms, the generator's physics, the
        # forecast features and anomaly detection. Without this job a third of
        # the project's tests would not gate a merge.
        run: python -m pytest -q

      - name: Apply migrations
        # dbt models read tables Flyway owns, so the schema has to exist first.
        # Applied with the Flyway CLI rather than by booting the backend, which
        # would pull the whole JVM in for a job that does not need it.
        run: |
          docker run --rm --network host \
            -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql" \
            flyway/flyway:11-alpine \
            -url=jdbc:postgresql://localhost:5432/citypulse \
            -user=citypulse -password=ci-postgres-password \
            -connectRetries=10 migrate

      - name: Seed a slice of telemetry
        working-directory: data-engineering
        # dbt tests assert on real rows, so there has to be something to assert
        # on. Two days is enough to exercise every model without making the job
        # slow. Seeded, so a dbt failure here is reproducible.
        env:
          CITYPULSE_DB_URL: postgresql://localhost:5432/citypulse
          CITYPULSE_DB_USER: citypulse
          CITYPULSE_DB_PASSWORD: ci-postgres-password
        run: |
          python -m generator.main --sink jsonl --out /tmp/ci-events.jsonl --no-realtime \
            --seed 7 --tick-seconds 300 \
            --simulate-from "$(date -u -d '2 days ago' +%Y-%m-%dT00:00:00Z)" \
            --simulate-to "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --quiet
          python -m pipeline.local_runner --input /tmp/ci-events.jsonl \
            --max-lateness-hours 72 --quiet

      - name: dbt build
        working-directory: data-engineering/dbt
        # `build` rather than `run` then `test`: build interleaves them, so a
        # model producing bad data never reaches the marts — the run fails first.
        env:
          # dbt's profile defaults host, port and database to exactly what the
          # service container provides; only the password has no default.
          DBT_PROFILES_DIR: .
          CITYPULSE_DB_PASSWORD: ci-postgres-password
        run: dbt build

  security:
    name: Security checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan can inspect every commit, not only
          # the tip. A credential committed and then reverted is still leaked.
          fetch-depth: 0

      - name: Scan history for committed secrets
        # The action's own binary, run directly against the full history rather
        # than via the action wrapper. The wrapper derives a commit range from
        # the push event, and on the first push to a new repository that range
        # includes the parent of the root commit — which does not exist, so git
        # errors and the step fails having scanned nothing. A full scan has no
        # such edge case and is fast at this repository's size.
        run: |
          VERSION=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        working-directory: frontend
        # Fails on high and critical only. Failing on every low-severity
        # advisory trains people to ignore the job, which is worse than not
        # running it. Lower-severity findings still appear in the log.
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Check for known-vulnerable Java dependencies
        # Advisory: the NVD feed is rate-limited without an API key and produces
        # false positives, so this reports without blocking the merge. It becomes
        # blocking in Phase 8 once an NVD key is configured.
        continue-on-error: true
        run: >-
          ./backend/mvnw -B -f backend/pom.xml
          org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=8
          -DskipProvidedScope=true

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    # An image is never built from code that failed its tests.
    needs: [backend, frontend, data-platform]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: citypulse/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: citypulse/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the backend image starts and reports healthy
        # A build that produces an image which cannot boot is not a passing build.
        run: |
          docker network create citypulse-ci

          docker run -d --name ci-postgres --network citypulse-ci \
            -e POSTGRES_DB=citypulse \
            -e POSTGRES_USER=citypulse \
            -e POSTGRES_PASSWORD=ci-postgres-password \
            postgres:17-alpine

          echo "Waiting for PostgreSQL..."
          for _ in $(seq 1 30); do
            if docker exec ci-postgres pg_isready -U citypulse -d citypulse >/dev/null 2>&1; then break; fi
            sleep 2
          done

          docker run -d --name ci-backend --network citypulse-ci \
            -e CITYPULSE_DB_URL=jdbc:postgresql://ci-postgres:5432/citypulse \
            -e CITYPULSE_DB_USER=citypulse \
            -e CITYPULSE_DB_PASSWORD=ci-postgres-password \
            -e CITYPULSE_JWT_SECRET=ci-only-jwt-secret-at-least-32-bytes-long-0123456789 \
            -p 8080:8080 \
            citypulse/backend:${{ github.sha }}

          echo "Waiting for the backend to report healthy..."
          for _ in $(seq 1 45); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend is healthy."
              # Also confirm migrations ran and seeded data is queryable.
              curl -sf http://localhost:8080/api/v1/meta/platform | grep -q '"success":true'
              echo "Platform metadata endpoint responded."
              exit 0
            fi
            sleep 2
          done

          echo "Backend did not become healthy. Logs:"
          docker logs ci-backend
          exit 1

      - name: Clean up
        if: always()
        run: |
          docker rm -f ci-backend ci-postgres 2>/dev/null || true
          docker network rm citypulse-ci 2>/dev/null || true

  stack:
    name: Full stack — compose up & verify
    runs-on: ubuntu-latest
    needs: [docker]

    # This job exists because of a gap recorded in Phase 3: every service was
    # verified individually on the development machine, but bringing all of them
    # up together needed more disk than that machine had. A CI runner has room,
    # so the claim gets tested here rather than left as "it should work".
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The full image set is roughly 5 GB. A hosted runner ships with several
        # gigabytes of toolchains this job never touches, and reclaiming them is
        # cheaper than discovering the limit mid-build.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h / | tail -1

      - name: Write a throwaway .env
        # Compose fails fast on missing secrets rather than booting on vendor
        # defaults, so these must exist. Every value is generated here rather
        # than written into the file: a key-shaped literal in a committed
        # workflow is indistinguishable from a real one to a scanner, to a
        # reader, and to anyone who copies the pattern. gitleaks flagged exactly
        # that, correctly.
        run: |
          FERNET=$(python3 -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          JWT=$(openssl rand -base64 48 | tr -d '\n')
          PGPASS=$(openssl rand -hex 16)
          MINIOPASS=$(openssl rand -hex 16)
          AIRFLOWPASS=$(openssl rand -hex 12)
          AIRFLOWSECRET=$(openssl rand -base64 32 | tr -d '\n')

          # Masked so a failing step cannot echo them into a public log.
          for v in "$JWT" "$PGPASS" "$MINIOPASS" "$AIRFLOWPASS" "$AIRFLOWSECRET" "$FERNET"; do
            echo "::add-mask::$v"
          done

          {
            echo "POSTGRES_DB=citypulse"
            echo "POSTGRES_USER=citypulse"
            echo "POSTGRES_PASSWORD=$PGPASS"
            echo "POSTGRES_HOST_PORT=5432"
            echo "CITYPULSE_DB_URL=jdbc:postgresql://postgres:5432/citypulse"
            echo "CITYPULSE_DB_USER=citypulse"
            echo "CITYPULSE_DB_PASSWORD=$PGPASS"
            echo "CITYPULSE_JWT_SECRET=$JWT"
            echo "CITYPULSE_FRONTEND_URL=http://localhost:3000"
            echo "CITYPULSE_CORS_ORIGINS=http://localhost:3000"
            echo "CITYPULSE_DEMO_MODE=true"
            echo "NEXT_PUBLIC_API_BASE_URL=http://localhost:8080"
            echo "MINIO_ROOT_USER=citypulse"
            echo "MINIO_ROOT_PASSWORD=$MINIOPASS"
            echo "AIRFLOW_FERNET_KEY=$FERNET"
            echo "AIRFLOW_SECRET_KEY=$AIRFLOWSECRET"
            echo "AIRFLOW_ADMIN_USER=admin"
            echo "AIRFLOW_ADMIN_PASSWORD=$AIRFLOWPASS"
          } > .env

      - name: Validate the compose definition
        run: docker compose --profile streaming config --quiet

      - name: Bring the streaming stack up
        run: docker compose --profile streaming up -d --build

      - name: Wait for every service to report healthy
        # Health, not "started". A container that is running but failing its
        # health check has not proven anything.
        run: |
          for service in citypulse-postgres citypulse-kafka citypulse-minio citypulse-backend; do
            echo "Waiting for $service..."
            for _ in $(seq 1 90); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$service" 2>/dev/null || echo missing)
              if [ "$status" = "healthy" ]; then echo "  $service healthy"; break; fi
              if [ "$status" = "missing" ]; then sleep 2; continue; fi
              sleep 2
            done
            if [ "$(docker inspect -f '{{.State.Health.Status}}' "$service" 2>/dev/null)" != "healthy" ]; then
              echo "$service never became healthy:"
              docker logs --tail 60 "$service"
              exit 1
            fi
          done
          docker compose --profile streaming ps

      - name: Verify Kafka topics were created
        run: |
          topics=$(docker exec citypulse-kafka \
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list)
          echo "$topics"
          for expected in citypulse.traffic.v1 citypulse.dlq.v1; do
            echo "$topics" | grep -q "$expected" || { echo "missing topic $expected"; exit 1; }
          done

      - name: Verify events reach the curated layer
        # The end-to-end claim: the generator publishes, Spark consumes, and
        # curated windows appear. Anything short of this is a stack that starts
        # rather than a pipeline that works.
        run: |
          for _ in $(seq 1 60); do
            count=$(docker exec citypulse-postgres psql -U citypulse -d citypulse -tAc \
              "SELECT count(*) FROM zone_metrics" 2>/dev/null || echo 0)
            echo "curated windows: $count"
            if [ "${count:-0}" -gt 0 ]; then
              echo "Events flowed generator -> Kafka -> Spark -> curated."
              exit 0
            fi
            sleep 10
          done
          echo "No curated windows appeared. Logs:"
          docker logs --tail 80 citypulse-spark
          docker logs --tail 40 citypulse-generator
          exit 1

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose --profile streaming ps
          for c in citypulse-kafka citypulse-spark citypulse-generator citypulse-backend; do
            echo "=== $c ==="; docker logs --tail 60 "$c" 2>&1 || true
          done

      - name: Tear down
        if: always()
        run: docker compose --profile streaming down -v
