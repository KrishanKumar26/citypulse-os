version: 2

sources:
  - name: citypulse
    description: >
      Tables written by the ingestion pipeline. Flyway owns this schema; dbt
      only reads from it, so a model can never be the reason a migration fails.
    schema: public
    tables:
      - name: cities
      - name: zones
      - name: data_sources
      - name: traffic_events
        description: Per-zone traffic readings, one row per validated event.
        # A gap longer than this means the feed stopped, which is worth failing
        # a run over rather than quietly charting a flat line.
        freshness:
          warn_after: {count: 2, period: hour}
          error_after: {count: 12, period: hour}
        loaded_at_field: ingested_at
      - name: weather_events
        loaded_at_field: ingested_at
      - name: air_quality_events
        loaded_at_field: ingested_at
      - name: incidents
      - name: city_events
      - name: zone_metrics
      - name: ingestion_dlq
      - name: data_quality_metrics
