# Spark configuration for the containerised streaming job.
#
# Credentials are NOT here. They arrive as environment variables and are read by
# the S3A provider below, so this file is safe to commit (PRD §30).

# --- S3A / MinIO --------------------------------------------------------------
# MinIO speaks the S3 API, so one code path covers local and AWS; only the
# endpoint changes.
spark.hadoop.fs.s3a.impl                      org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                  http://minio:9000
# Required for MinIO: it addresses buckets by path, not by virtual host.
spark.hadoop.fs.s3a.path.style.access         true
spark.hadoop.fs.s3a.connection.ssl.enabled    false
# Credentials still do not live here. spark_job.py reads MINIO_ROOT_USER and
# MINIO_ROOT_PASSWORD from the environment and sets fs.s3a.access.key and
# fs.s3a.secret.key on the running Hadoop configuration; this provider is the one
# that reads those two keys, so it names where the values arrive rather than
# supplying them.
#
# It previously named org.apache.hadoop.fs.s3a.auth.EnvironmentVariableCredentialsProvider,
# which does not exist in hadoop-aws and never has — the AWS SDK has a class by
# that name, under its own package, and it reads AWS_ACCESS_KEY_ID rather than
# the MinIO variables this stack sets. Naming a provider here replaces the whole
# default chain, so the keys the job had already set were never consulted.
spark.hadoop.fs.s3a.aws.credentials.provider  org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# Writes land at their final path instead of being copied there at commit time.
# On object storage a rename is a full copy, which makes the default committer
# both slow and non-atomic.
spark.hadoop.fs.s3a.committer.name            directory
spark.sql.sources.commitProtocolClass         org.apache.spark.internal.io.cloud.PathOutputCommitProtocol
spark.sql.parquet.output.committer.class      org.apache.spark.internal.io.cloud.BindingParquetOutputCommitter

# --- Sizing -------------------------------------------------------------------
# The demo moves thousands of events per minute, not millions. The default 200
# shuffle partitions would turn every micro-batch into 200 near-empty tasks and
# 200 tiny files.
spark.sql.shuffle.partitions                  8
spark.sql.adaptive.enabled                    true
spark.sql.adaptive.coalescePartitions.enabled true

# Everything is stored and compared in UTC; the UI converts to the city's zone.
spark.sql.session.timeZone                    UTC

# --- Streaming ----------------------------------------------------------------
# Bounded so a backlog is worked through steadily rather than in one batch that
# exhausts the container's memory limit.
spark.sql.streaming.stateStore.providerClass  org.apache.spark.sql.execution.streaming.state.HDFSBackedStateStoreProvider
spark.sql.streaming.metricsEnabled            true
