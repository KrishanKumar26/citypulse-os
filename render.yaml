# =============================================================================
# Render — backend deployment (free tier)
#
#   Backend   Render web service, this file
#   Database  Neon PostgreSQL, created separately
#   Frontend  Vercel, see vercel.json
#
# Render's free tier is genuinely free and needs no card, but it has one
# behaviour that shapes everything below: a free web service is stopped after
# 15 minutes without traffic, and the next request waits for it to start again.
# For a JVM that is roughly a minute.
#
# There is deliberately no keep-warm workflow. Pinging every ten minutes would
# consume more than the whole free Actions allowance on nothing but pings, so
# the cold start is documented in docs/DEPLOYMENT.md §9 and left in place. An
# external uptime monitor does the same job without spending the allowance.
#
# The database is deliberately *not* declared here. Render's free PostgreSQL is
# deleted after 90 days; Neon's free tier is not, and losing the database on a
# date nobody wrote down is a worse trade than managing one more service.
# =============================================================================

services:
  - type: web
    name: citypulse-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore   # Nearest to the seeded cities, which are Indian metros.
    branch: main

    healthCheckPath: /actuator/health

    envVars:
      # --- Database -------------------------------------------------------
      # Set in the Render dashboard from the Neon connection string. Not here:
      # a connection string in a committed file is a credential in a committed
      # file, whatever the tier.
      - key: CITYPULSE_DB_URL
        sync: false
      - key: CITYPULSE_DB_USER
        sync: false
      - key: CITYPULSE_DB_PASSWORD
        sync: false

      # --- Secrets --------------------------------------------------------
      # generateValue asks Render to create a strong value once and keep it.
      # Regenerating it would invalidate every issued token, so it must persist
      # across deploys — which it does.
      - key: CITYPULSE_JWT_SECRET
        generateValue: true

      # --- Application ----------------------------------------------------
      # The deployed frontend. Committed rather than left to the dashboard,
      # because a public URL is not a credential and the browser silently
      # blocks every request when this is wrong — a dashboard that loads and
      # then shows nothing, with no error anywhere the user can see. It is
      # worth having in the file that describes the deployment.
      #
      # A preview branch on Vercel gets its own hostname and would be blocked
      # by this. That is the correct default: an origin is allowed because it
      # was named, not because it happens to be on vercel.app.
      - key: CITYPULSE_FRONTEND_URL
        value: https://citypulse-os-two.vercel.app
      - key: CITYPULSE_CORS_ORIGINS
        value: https://citypulse-os-two.vercel.app
      - key: CITYPULSE_LOG_LEVEL
        value: INFO

      # The platform is serving generated telemetry. This must stay true until
      # a real feed replaces it — PRD §42 forbids presenting synthetic data as
      # real, and this flag is what the UI reads to label it.
      - key: CITYPULSE_DEMO_MODE
        value: "true"

      # No mail provider is wired up. Requiring verification would lock every
      # new account out, because the link only reaches the application log.
      - key: CITYPULSE_REQUIRE_EMAIL_VERIFICATION
        value: "false"

      # --- First administrator --------------------------------------------
      # Set both in the dashboard to have an account created on first boot.
      # Leaving them unset creates nothing, which is the safer default for a
      # publicly reachable deployment.
      - key: CITYPULSE_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: CITYPULSE_BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      # --- JVM sizing -----------------------------------------------------
      # The free instance has 512 MB. Left alone, the JVM sizes its heap as a
      # fraction of *container* memory and is then killed when the rest of the
      # process pushes it past the limit. Capping the heap at 300 MB leaves
      # room for metaspace, thread stacks and the container itself.
      #
      # SerialGC rather than G1: on a single shared core, G1's background
      # threads cost more than they return.
      #
      # JAVA_OPTS, not JAVA_TOOL_OPTIONS. The Dockerfile's ENTRYPOINT expands
      # JAVA_OPTS, so setting it here *replaces* the image's defaults, which is
      # what is wanted. JAVA_TOOL_OPTIONS is *appended* to whatever the command
      # line already carries — and the image already sets -XX:+UseG1GC, so the
      # first deploy died before Spring even started:
      #
      #     Error occurred during initialization of VM
      #     Multiple garbage collectors selected
      #
      # ExitOnOutOfMemoryError is carried over from the image deliberately. A
      # JVM that has exhausted a 512 MB instance will not recover, and dying
      # lets Render restart it instead of leaving a process that answers the
      # health check while failing every request.
      - key: JAVA_OPTS
        value: "-Xmx300m -Xms128m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError"
