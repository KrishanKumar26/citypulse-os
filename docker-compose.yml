# =============================================================================
# CityPulse OS — local development stack
#
#   cp .env.example .env      # then fill in the secrets
#   docker compose up --build                      # core: postgres, backend, frontend
#   docker compose --profile streaming up -d       # + kafka, minio, spark
#   docker compose --profile orchestration up -d   # + airflow
#
# Services are split across profiles rather than all started together, because
# the whole stack does not fit comfortably in 8 GB. Airflow alone wants ~2 GB and
# Spark another ~1.5 GB; running everything at once on a laptop means swapping,
# which looks like a broken pipeline rather than an exhausted machine. Each
# profile is independently useful:
#
#   (none)          Develop the app. The pipeline is not needed to work on auth,
#                   the API or the UI.
#   streaming       Develop the pipeline. Kafka + MinIO + Spark, ~3 GB.
#   orchestration   Develop or test the DAGs, ~2.5 GB.
#
# Rough memory budget (limits are set explicitly below so a runaway container
# gets killed rather than taking the host down with it):
#   core           ~1.3 GB
#   + streaming    ~3.0 GB
#   + orchestration ~2.5 GB
#
# No secret is written in this file. Every credential comes from .env, which is
# git-ignored.
# =============================================================================

name: citypulse

x-de-environment: &de-environment
  CITYPULSE_PG_DSN: postgresql://${POSTGRES_USER:-citypulse}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-citypulse}
  CITYPULSE_DB_URL: postgresql://postgres:5432/${POSTGRES_DB:-citypulse}
  CITYPULSE_DB_USER: ${POSTGRES_USER:-citypulse}
  CITYPULSE_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  CITYPULSE_DE_HOME: /opt/citypulse/data-engineering

services:
  # ---------------------------------------------------------------------------
  # Core — always started
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: citypulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citypulse}
      POSTGRES_USER: ${POSTGRES_USER:-citypulse}
      # Required. Compose fails fast rather than starting an unsecured database.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Scrypt rather than the md5 default; md5 is deprecated upstream.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      # Bound to loopback so the database is not reachable from the network.
      #
      # The host port is configurable because a developer may already run
      # PostgreSQL natively on 5432; without this the stack refuses to start and
      # the only fix is stopping their database. Containers always reach each
      # other on 5432 regardless of what this is set to.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The backend waits on this, so it must not start before migrations can run.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citypulse} -d ${POSTGRES_DB:-citypulse}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: citypulse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CITYPULSE_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-citypulse}
      CITYPULSE_DB_USER: ${POSTGRES_USER:-citypulse}
      CITYPULSE_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      CITYPULSE_JWT_SECRET: ${CITYPULSE_JWT_SECRET:?CITYPULSE_JWT_SECRET must be set in .env}
      CITYPULSE_FRONTEND_URL: ${CITYPULSE_FRONTEND_URL:-http://localhost:3000}
      CITYPULSE_CORS_ORIGINS: ${CITYPULSE_CORS_ORIGINS:-http://localhost:3000}
      CITYPULSE_DEMO_MODE: ${CITYPULSE_DEMO_MODE:-true}
      CITYPULSE_REQUIRE_EMAIL_VERIFICATION: ${CITYPULSE_REQUIRE_EMAIL_VERIFICATION:-false}
      CITYPULSE_BOOTSTRAP_ADMIN_EMAIL: ${CITYPULSE_BOOTSTRAP_ADMIN_EMAIL:-}
      CITYPULSE_BOOTSTRAP_ADMIN_PASSWORD: ${CITYPULSE_BOOTSTRAP_ADMIN_PASSWORD:-}
      CITYPULSE_BOOTSTRAP_ADMIN_NAME: ${CITYPULSE_BOOTSTRAP_ADMIN_NAME:-Platform Administrator}
      CITYPULSE_LOG_LEVEL: ${CITYPULSE_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Generous: the JVM plus Flyway migrations take a while on a cold start.
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Next.js inlines NEXT_PUBLIC_* at build time, so this must be a build
        # arg rather than only a runtime variable.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    container_name: citypulse-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 384M

  # ---------------------------------------------------------------------------
  # profile: streaming — Kafka, MinIO, Spark
  # ---------------------------------------------------------------------------
  kafka:
    # The Apache-published image, not bitnami/kafka. Bitnami moved its public
    # catalogue in 2025 and `bitnami/kafka:3.9` no longer resolves at all —
    # which surfaces as a pull failure the first time anyone runs this, long
    # after the file looked correct. Note the environment variables differ from
    # Bitnami's: plain KAFKA_* here, not KAFKA_CFG_*.
    image: apache/kafka:4.0.0
    container_name: citypulse-kafka
    profiles: [streaming]
    restart: unless-stopped
    environment:
      # KRaft mode: no ZooKeeper. One less service to run and one less thing to
      # explain (PRD §20, docs/ARCHITECTURE.md §2).
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Three listeners: PLAINTEXT for other containers, CONTROLLER for KRaft's
      # own quorum traffic, EXTERNAL for tools running on the host. They need
      # separate ports because a broker advertises a different hostname to each
      # audience — `kafka` resolves inside the compose network, `localhost` does
      # not, and vice versa.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker, so nothing can be replicated further than one copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Topics are created explicitly by kafka/create_topics.py. Auto-creation
      # would silently produce a 1-partition topic on a typo'd name, which then
      # looks like a consumer that mysteriously receives nothing.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  kafka-init:
    build:
      context: ./data-engineering
      dockerfile: Dockerfile
    container_name: citypulse-kafka-init
    profiles: [streaming]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      <<: *de-environment
    # Idempotent: existing topics are left alone, so this is safe on every up.
    command: ["python", "-m", "kafka_admin.create_topics", "--bootstrap-servers", "kafka:9092"]
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: citypulse-minio
    profiles: [streaming]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: citypulse-minio-init
    profiles: [streaming]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    # Creates the lake bucket and its layer prefixes (PRD §22). `mb --ignore-existing`
    # keeps this safe to re-run.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/citypulse-lake &&
      mc mb --ignore-existing local/citypulse-lake/raw &&
      mc mb --ignore-existing local/citypulse-lake/processed &&
      mc mb --ignore-existing local/citypulse-lake/curated &&
      mc mb --ignore-existing local/citypulse-lake/features &&
      mc mb --ignore-existing local/citypulse-lake/rejected &&
      echo 'lake layout ready'
      "
    restart: "no"

  spark:
    build:
      context: ./data-engineering
      dockerfile: Dockerfile.spark
    container_name: citypulse-spark
    profiles: [streaming]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      # The backend, not postgres. A healthy database only means it accepts
      # connections; the tables this job writes to exist only after Flyway has
      # run, and Flyway runs when the backend boots.
      backend:
        condition: service_healthy
    environment:
      <<: *de-environment
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    # Runs the streaming job directly rather than standing up a master and a
    # worker. A standalone cluster on one machine adds two containers and a
    # scheduling layer without adding parallelism the host can actually use.
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      # No --packages: the connector jars are baked into the image. Resolving
      # them here writes to $HOME/.ivy2, and the image's user has no writable
      # home — the container died on that the first time the stack ran in CI.
      - --conf
      - spark.driver.memory=1g
      - /opt/citypulse/data-engineering/pipeline/spark_job.py
      - --bootstrap-servers
      - kafka:9092
      - --write-lake
    volumes:
      - spark-checkpoints:/tmp/citypulse-spark-checkpoint
    deploy:
      resources:
        limits:
          memory: 1536M

  generator:
    build:
      context: ./data-engineering
      dockerfile: Dockerfile
    container_name: citypulse-generator
    profiles: [streaming]
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      # Waits for the backend so the schema exists. Starting on a healthy
      # postgres alone failed with 'relation "cities" does not exist' — the
      # generator reads the zone catalogue before it can emit anything.
      backend:
        condition: service_healthy
    environment:
      <<: *de-environment
    command:
      - python
      - -m
      - generator.main
      - --sink
      - kafka
      - --bootstrap-servers
      - kafka:9092
      - --tick-seconds
      - "10"
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # profile: orchestration — Airflow
  # ---------------------------------------------------------------------------
  airflow:
    build:
      context: ./data-engineering
      dockerfile: Dockerfile.airflow
    container_name: citypulse-airflow
    profiles: [orchestration]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *de-environment
      # Airflow keeps its own metadata in a separate database on the same
      # server. Sharing the application schema would let a scheduler migration
      # and a Flyway migration collide.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-citypulse}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/citypulse_airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY must be set in .env}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY must be set in .env}
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./data-engineering/airflow/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  postgres-data:
    driver: local
  kafka-data:
    driver: local
  minio-data:
    driver: local
  spark-checkpoints:
    driver: local
  airflow-logs:
    driver: local
